<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanskrit Vakya Nirmata - Dictionary</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand">Sanskrit Vakya Nirmata</div>
    <a href="/index.html">Generator</a>
    <a href="/dictionary.html" class="active">Dictionary</a>
    <a href="/rules.html">Rules</a>
    <a href="/tests.html">Tests</a>
  </nav>

  <main>
    <h1>Dictionary</h1>
    <p class="subtitle">Search the vocabulary, browse by category, or add a new word.</p>

    <div class="card">
      <div class="input-row">
        <input type="text" id="searchInput" placeholder="Search Sanskrit or English (e.g. फलम् or fruit)">
        <button id="searchBtn">Search</button>
      </div>
      <div id="searchResult" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 style="margin:0;">Browse</h2>
        <button id="openAddWordModalBtn">+ Add New Word</button>
      </div>
      <div class="input-row" style="margin-bottom:14px;">
        <select id="categoryFilter">
          <option value="">All categories</option>
          <option value="Noun">Noun</option>
          <option value="Verb">Verb</option>
          <option value="Adjective">Adjective</option>
          <option value="Pronoun">Pronoun</option>
          <option value="Adverb">Adverb</option>
          <option value="Other">Other</option>
        </select>
        <button id="browseBtn" class="secondary">Refresh</button>
      </div>
      <div class="table-container">
        <table id="wordsTable"></table>
      </div>
    </div>


    <div class="card">
      <h2 style="margin-top:0;">Pending suggestions (from AI assist)</h2>
      <table id="pendingTable"></table>
      <div id="pendingEmpty" class="muted"></div>
    </div>

    <!-- Word Modal -->
    <div id="wordModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="wordModalTitle">Add New Word</h2>
          <button type="button" class="close-btn" id="closeWordModalBtn">✕</button>
        </div>
        <form class="add-word-form" id="wordForm">
          <input type="hidden" name="original_lemma" id="original_lemma">
          <label>Sanskrit Lemma <input type="text" name="lemma" required></label>
          <label>IAST <input type="text" name="iast" required></label>
          <label>English Meaning <input type="text" name="english" required></label>
          <label>Category
            <select name="category" required>
              <option value="Noun">Noun</option>
              <option value="Pronoun">Pronoun</option>
              <option value="Verb">Verb</option>
              <option value="Adjective">Adjective</option>
              <option value="Adverb">Adverb</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>Gender
            <select name="gender">
              <option value="">Not Applicable</option>
              <option value="masculine">Masculine</option>
              <option value="feminine">Feminine</option>
              <option value="neuter">Neuter</option>
            </select>
          </label>
          <label>Person (for pronouns/verbs)
            <select name="person">
              <option value="">Not Applicable</option>
              <option value="1">1st Person</option>
              <option value="2">2nd Person</option>
              <option value="3">3rd Person</option>
            </select>
          </label>
          <label>Number
            <select name="number">
              <option value="">Not Applicable</option>
              <option value="singular">Singular</option>
              <option value="dual">Dual</option>
              <option value="plural">Plural</option>
            </select>
          </label>
          <label class="full">Sample Forms (JSON array)
            <textarea name="forms" rows="3" placeholder='[{"form":"...","case":"nominative","vibhakti":"prathama","number":"singular"}]'></textarea>
          </label>
          <label class="full">Description/Notes
            <textarea name="notes" rows="2" placeholder="Optional notes"></textarea>
          </label>
          <div class="full" style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="button" class="secondary" id="cancelWordModalBtn">Cancel</button>
            <button type="submit" id="saveWordBtn">Save Word</button>
          </div>
        </form>
        <div id="wordFormMessage" class="muted" style="margin-top:10px;"></div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/dictionary.js"></script>
</body>
</html>
